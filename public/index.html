<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitGraph</title>
<style>
  :root {
    --bg: #ffffff; --bg-head: #f6f7f9; --fg: #1d2330; --muted: #6b7385; --line: #e6e8ee; --hover: #f0f3f9;
    --b-primary: #2f6fdf; --stale: #a3a9b4;
    --p1: #e8710a; --p2: #1e9e6a; --p3: #8b5cf6; --p4: #d6336c; --p5: #0e9fb5; --p6: #b8860b;
    --refs-w: 260px; --graph-w: 40px; --row-h: 34px; --detail-w: 400px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181d; --bg-head: #1c1f26; --fg: #e6e8ee; --muted: #8b93a5; --line: #2a2e37; --hover: #20242d;
      --b-primary: #5b93ff; --stale: #636a78;
      --p1: #ff9d3d; --p2: #3ccf91; --p3: #a78bfa; --p4: #f06595; --p5: #22c3dc; --p6: #e0b341;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181d; --bg-head: #1c1f26; --fg: #e6e8ee; --muted: #8b93a5; --line: #2a2e37; --hover: #20242d;
    --b-primary: #5b93ff; --stale: #636a78;
    --p1: #ff9d3d; --p2: #3ccf91; --p3: #a78bfa; --p4: #f06595; --p5: #22c3dc; --p6: #e0b341;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg-head); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
  .title h1 { font-size: 16px; margin: 0; }
  .title .repo { margin-left: 0; border-color: transparent; color: var(--muted); font: inherit; }
  .title .repo:hover { border-color: var(--line); color: var(--fg); }

  /* Menus de l'en-tête */
  .menu-wrap { position: relative; }
  .menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 240px; padding: 10px; background: var(--bg-head); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
  .menu[hidden] { display: none; }
  .export-menu { left: auto; right: 0; }
  .export-menu button { display: block; width: 100%; margin: 0 0 4px; text-align: left; }
  .export-menu p { margin: 6px 0 0; }
  .repo-menu { width: min(520px, 90vw); }
  .menu .label, .repo-picker .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin: 6px 0; }
  .repo-list { list-style: none; margin: 0 0 8px; padding: 0; max-height: 50vh; overflow-y: auto; }
  .repo-list li { display: flex; flex-direction: column; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
  .repo-list li:hover { background: var(--hover); }
  .repo-list li.current { box-shadow: inset 3px 0 0 var(--b-primary); }
  .repo-list li.missing { opacity: .45; }
  .repo-list li span { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .repo-open { display: flex; gap: 6px; }
  .repo-open input, .search input { flex: 1; min-width: 0; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
  .repo-open button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  body.no-repo .title > :not(h1, .menu-wrap:first-of-type, #theme), body.no-repo .lanebar { display: none; }
  button.browse { margin: 6px 0 0; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; }
  button.browse:disabled { opacity: .5; cursor: wait; }
  .repo-picker { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .repo-picker h2 { font-size: 16px; }

  /* Recherche */
  .search { display: flex; align-items: center; gap: 8px; }
  .search input { width: 240px; }
  .row.match { background: color-mix(in srgb, var(--p6) 14%, transparent); }
  .row.match-current, .row.match-current:hover { background: color-mix(in srgb, var(--p6) 30%, transparent); outline: 1px solid var(--p6); outline-offset: -1px; }

  /* Repères de mois */
  .row { position: relative; }
  .row.month-start { border-top: 1px solid color-mix(in srgb, var(--muted) 45%, transparent); }
  .month { position: absolute; left: 10px; top: -8px; z-index: 1; padding: 0 6px; font-size: 10.5px; line-height: 15px; text-transform: capitalize; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; pointer-events: none; }
  .row.first .month { top: 2px; }
  .title .note { margin-left: auto; color: var(--muted); font-size: 12px; }
  .title button { margin-left: 12px; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 3px 10px; cursor: pointer; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .legend .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .legend .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-right: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; white-space: nowrap; transition: opacity .12s; }
  .chip:hover { background: var(--hover); }
  .chip.faded { opacity: .35; }
  .chip.current { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .chip .meta { color: var(--muted); font-size: 12px; }
  .chip.deleted { border-style: dashed; }
  .more { background: none; border: 1px dashed var(--line); color: var(--muted); border-radius: 999px; padding: 3px 10px; cursor: pointer; font: inherit; }
  .more:hover { color: var(--fg); background: var(--hover); }

  .graph { position: relative; overflow-x: auto; }
  .rows { position: relative; min-width: 900px; }
  svg.lanes { position: absolute; top: 0; pointer-events: none; z-index: 2; }
  .row { display: grid; grid-template-columns: var(--refs-w) var(--graph-w) minmax(200px, 1fr) 170px 120px 76px; align-items: center; height: var(--row-h); border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
  .row:hover { background: var(--hover); }
  .row > div { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 8px; }
  .refs { display: flex; justify-content: flex-end; gap: 4px; }
  .msg.merge { color: var(--muted); }
  .author { color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .avatar { flex: none; width: 20px; height: 20px; border-radius: 50%; font-size: 10px; font-weight: 600; display: grid; place-items: center; color: #fff; }
  .date { color: var(--muted); }
  .hash { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }

  .pill { display: inline-flex; align-items: center; gap: 4px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 500;
          background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); }
  .pill.head { background: var(--c); color: #fff; border-color: var(--c); font-weight: 600; }
  .pill.remote { background: transparent; border-style: dashed; color: var(--muted); }
  .pill.deleted { background: transparent; border-style: dashed; font-style: italic; color: var(--muted); }
  .pill.tag { --c: var(--muted); background: transparent; border-radius: 3px 10px 10px 3px; }
  .refs .pill[data-b] { cursor: pointer; }
  .pill .ahead { font-size: 11px; font-weight: 700; }
  .pill svg { flex: none; }

  /* Zoom */
  .crumbs { display: flex; align-items: center; gap: 10px; margin-top: 10px; min-height: 26px; }
  .crumbs a { color: var(--b-primary); text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  .crumbs .sep { color: var(--muted); }
  .crumbs .right { margin-left: auto; }
  .hint { color: var(--muted); font-size: 12px; }
  .msg .hint { margin-left: 10px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .row.gap { cursor: pointer; }
  .row.gap .msg { color: var(--muted); font-style: italic; }
  .stub { pointer-events: stroke; }
  .loading { margin: 24px 16px; }
  .error { margin: 24px 16px; color: var(--p4); white-space: pre-wrap; }

  /* Structure seule : commits ordinaires regroupés */
  .row.squash { cursor: pointer; }
  .row.squash .msg { color: var(--muted); font-style: italic; }

  /* Branches présentes à l'endroit où l'on est dans le défilement */
  .lanebar { display: grid; grid-template-columns: var(--refs-w) var(--graph-w) 1fr; align-items: center; height: 28px; margin: 10px -16px -12px; border-top: 1px solid var(--line); background: var(--bg); }
  .lanebar svg { display: block; }
  .lanebar .lead { padding: 0 8px; text-align: right; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .lanebar .names { display: flex; gap: 14px; padding: 0 8px; overflow: hidden; white-space: nowrap; }
  .lname { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
  .lname:hover { text-decoration: underline; }
  .lname i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .lname.deleted { font-style: italic; color: var(--muted); }

  /* Détail d'un commit */
  .row[data-id] { cursor: pointer; }
  .row.selected, .row.selected:hover { background: color-mix(in srgb, var(--b-primary) 16%, transparent); }
  body.detail-open .graph, body.detail-open header { margin-right: var(--detail-w); }
  .detail { position: fixed; top: 0; right: 0; bottom: 0; width: var(--detail-w); z-index: 10; overflow-y: auto; padding: 16px 18px 24px; background: var(--bg-head); border-left: 1px solid var(--line); }
  .detail[hidden] { display: none; }
  .detail .close { float: right; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 16px; line-height: 1; }
  .detail h2 { font-size: 15px; margin: 0 40px 8px 0; line-height: 1.35; }
  .detail .body { white-space: pre-wrap; color: var(--muted); margin: 0 0 12px; font: inherit; }
  .detail dl { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; margin: 14px 0; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
  .detail .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
  .detail a { color: var(--b-primary); cursor: pointer; text-decoration: none; }
  .detail a:hover { text-decoration: underline; }
  .detail .copy { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 5px; font-size: 11px; padding: 0 6px; cursor: pointer; }
  .detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 8px; display: flex; gap: 8px; }
  .detail h3 .stat { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .files { list-style: none; margin: 0; padding: 0; }
  .files li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); font-size: 12px; }
  .files .path { overflow-wrap: anywhere; }
  .files .path span { color: var(--muted); }
  .add { color: var(--p2); } .del { color: var(--p4); }

  /* Modifications d'un fichier */
  body.detail-wide { --detail-w: min(960px, 62vw); }
  .files li[data-file] { cursor: pointer; }
  .files li[data-file]:hover { background: var(--hover); }
  .files .chev { display: inline-block; width: 12px; color: var(--muted); transition: transform .12s; }
  .files li.open .chev { transform: rotate(90deg); }
  .files .renamed { display: block; margin-left: 12px; }
  .files li.diff { display: block; padding: 6px 0 10px; border-bottom: 0; }
  .difftable { width: 100%; border-collapse: collapse; font: 12px/1.45 ui-monospace, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .difftable td { padding: 0 6px; vertical-align: top; }
  .difftable .n { width: 1%; min-width: 34px; text-align: right; color: var(--muted); user-select: none; border-right: 1px solid var(--line); }
  .difftable .code { white-space: pre-wrap; word-break: break-all; }
  .difftable tr.add { background: color-mix(in srgb, var(--p2) 16%, transparent); }
  .difftable tr.del { background: color-mix(in srgb, var(--p4) 16%, transparent); }
  .difftable tr.hunk td { background: color-mix(in srgb, var(--b-primary) 10%, transparent); color: var(--muted); padding: 2px 6px; }

  /* Comparaison */
  .detail .back { display: inline-block; margin-bottom: 10px; }
  .cmp-form { display: flex; gap: 6px; align-items: center; margin: 4px 0 12px; }
  .cmp-form select { flex: 1; min-width: 0; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
  .cmp-form .copy { font-size: 14px; padding: 2px 8px; }
  .detail .ok { color: var(--p2); }
  .swatch { width: 10px; height: 10px; border-radius: 2px; align-self: center; }
  .swatch.cmp-a { background: var(--p1); } .swatch.cmp-b { background: var(--p5); }
  .row.cmp-a { box-shadow: inset 4px 0 0 var(--p1); }
  .row.cmp-b { box-shadow: inset 4px 0 0 var(--p5); }
  .cmp-list { list-style: none; margin: 0; padding: 0; }
  .cmp-list li { display: grid; grid-template-columns: 10px auto 1fr; gap: 2px 8px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .cmp-list li:hover { background: var(--hover); }
  .cmp-list .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .cmp-list .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp-list .m.merge { color: var(--muted); }
  .cmp-list .hint { grid-column: 3; }

  /* Mise en évidence d'une branche */
  .e, .n, .row .refs, .row .msg { transition: opacity .12s; }
  .focus .e:not(.on), .focus .n:not(.on) { opacity: .15; }
  .focus .row:not(.on) .msg, .focus .row:not(.on) .refs { opacity: .35; }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>GitGraph</h1>
    <span class="menu-wrap"><button class="repo" id="repo" title="Changer de dépôt"></button><div class="menu repo-menu" id="repo-menu" hidden></div></span>
    <span class="search"><input id="search" type="search" placeholder="Rechercher…  ( / )" autocomplete="off" spellcheck="false"><span class="hint" id="search-count"></span></span>
    <span class="note" id="note"></span>
    <label class="toggle" title="Range les commits issus d'un git pull dans la colonne de leur branche, au lieu de les dessiner en parallèle"><input type="checkbox" id="flatten"> Aplatir les git pull</label>
    <label class="toggle" title="Regroupe les commits ordinaires pour ne garder que les créations de branches, les merges et les tags"><input type="checkbox" id="structure"> Structure seule</label>
    <label class="toggle" title="Met en évidence la branche du commit survolé"><input type="checkbox" id="hover-hl"> Surbrillance au survol</label>
    <button id="compare-btn" title="Comparer deux branches">Comparer</button>
    <span class="menu-wrap"><button id="export-btn" title="Enregistrer la vue actuelle en image">Exporter</button><div class="menu export-menu" id="export-menu" hidden>
      <button data-export="png">Image PNG</button>
      <button data-export="svg">Image SVG <span class="hint">vectorielle</span></button>
      <p class="hint">La vue actuelle : zoom et options compris.</p>
      <p class="error" id="export-error" hidden></p>
    </div></span>
    <button id="theme">Thème</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="crumbs" id="crumbs"></div>
  <div class="lanebar"><div class="lead">Colonnes</div><svg id="lanebar-svg" height="28"></svg><div class="names" id="lanebar-names"></div></div>
</header>
<div class="graph"><div class="rows" id="rows"><p class="hint loading">Chargement du dépôt…</p></div></div>
<aside class="detail" id="detail" hidden></aside>

<script type="module">
// ---------------------------------------------------------------------------
// Données de démonstration, utilisées quand la page est ouverte sans gitgraph.js
// [id, date, auteur, message, parents], du plus récent au plus ancien
// ---------------------------------------------------------------------------
const DEMO_RAW = [
  ['v3',  '2026-11-06T16:20', 'Thomas Leroy', "Gestion des erreurs de l'API", ['v2']],
  ['n3',  '2026-11-04T10:05', 'Julie Martin', 'Préférences de notification par utilisateur', ['n2']],
  ['d8',  '2026-10-28T14:30', 'Marc Dubois',  "Corrige les tests d'intégration", ['d7']],
  ['n2',  '2026-10-20T09:40', 'Julie Martin', 'Notifications par e-mail', ['n1']],
  ['d7',  '2026-10-12T11:15', 'Marc Dubois',  'Passage à Node 22', ['d6']],
  ['v2',  '2026-10-05T17:00', 'Thomas Leroy', 'Migration des endpoints vers la v2', ['v1']],
  ['n1',  '2026-10-01T15:25', 'Julie Martin', 'Service de notifications', ['d6']],
  ['v1',  '2026-09-15T10:00', 'Thomas Leroy', 'Nouveau client API', ['d6']],
  ['d6',  '2026-07-01T09:10', 'Thomas Leroy', 'Corrige la connexion sous Safari', ['dm3']],
  ['dm3', '2026-06-10T16:45', 'Marc Dubois',  "Merge branch 'feature/export' into develop", ['d5', 'e2']],
  ['d5',  '2026-06-03T13:20', 'Marc Dubois',  'Optimise les requêtes SQL', ['d4']],
  ['e2',  '2026-05-20T11:30', 'Julie Martin', 'Export PDF', ['e1']],
  ['e1',  '2026-05-06T14:00', 'Julie Martin', 'Export CSV des commandes', ['d4']],
  ['d4',  '2026-04-14T10:50', 'Julie Martin', 'Corrige le fuseau horaire des dates', ['dm2']],
  ['m1',  '2026-03-10T18:00', 'Marc Dubois',  "Merge branch 'develop'", ['c2', 'dm2']],
  ['dm2', '2026-03-02T17:30', 'Marc Dubois',  "Merge branch 'feature/dashboard' into develop", ['d3', 'b3']],
  ['b3',  '2026-02-25T15:10', 'Thomas Leroy', 'Filtres par période', ['bm']],
  ['bm',  '2026-02-12T09:30', 'Thomas Leroy', "Merge branch 'develop' into feature/dashboard", ['b2', 'd3']],
  ['b2',  '2026-02-10T16:00', 'Thomas Leroy', 'Graphiques des ventes', ['b1']],
  ['d3',  '2026-02-02T11:00', 'Marc Dubois',  'Ajoute les logs serveur', ['d2']],
  ['b1',  '2026-01-20T10:20', 'Thomas Leroy', 'Squelette du tableau de bord', ['d2']],
  ['d2',  '2026-01-08T14:45', 'Marc Dubois',  'Corrige le build de production', ['dm1']],
  ['dm1', '2025-12-15T17:00', 'Marc Dubois',  "Merge branch 'feature/auth' into develop", ['d1b', 'a3']],
  ['a3',  '2025-12-10T12:30', 'Julie Martin', 'Gestion des tokens JWT', ['a2']],
  ['d1b', '2025-12-04T09:15', 'Marc Dubois',  'Mise à jour des dépendances', ['d1']],
  ['a2',  '2025-12-02T16:40', 'Julie Martin', 'Formulaire de connexion', ['a1']],
  ['a1',  '2025-11-20T10:00', 'Julie Martin', 'Modèle User', ['d1']],
  ['d1',  '2025-11-12T15:30', 'Marc Dubois',  'Configuration ESLint et Prettier', ['c2']],
  ['c2',  '2025-11-05T11:00', 'Marc Dubois',  'Mise en place du projet', ['c1']],
  ['c1',  '2025-11-03T09:00', 'Marc Dubois',  'Initial commit', []],
];
const DEMO = {
  demo: true,
  repo: 'mon-projet',
  now: '2026-11-09T12:00:00',
  commits: DEMO_RAW.map(([id, date, author, msg, parents]) => ({ id, hash: fakeHash(id), date, author, msg, parents })),
  refs: {
    head: 'develop',
    headCommit: 'd8',
    remoteName: 'origin',
    local:  { 'develop': 'd8', 'main': 'm1', 'feature/notifications': 'n3', 'feature/api-v2': 'v3' },
    remote: { 'develop': 'd8', 'main': 'm1', 'feature/notifications': 'n2', 'feature/api-v2': 'v3' },
    tags:   { 'v1.0': 'm1' },
  },
};

function fakeHash(s) {
  let h = 2166136261;
  for (const ch of s + '#') { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16).padStart(8, '0').slice(0, 7);
}

// Données réelles servies par gitgraph.js, sinon démo
async function loadData() {
  try {
    const res = await fetch('api/graph');
    if (res.ok) return await res.json();
  } catch {}
  return DEMO;
}
// Réponse JSON du serveur, avec un message clair si elle est vide ou illisible (serveur d'une version précédente)
async function readJson(res) {
  const text = await res.text();
  try { return JSON.parse(text); } catch {
    return { error: res.ok && text ? 'Réponse illisible du serveur.' : 'Le serveur ne connaît pas cette fonction : arrêtez gitgraph (Ctrl+C) et relancez-le.' };
  }
}

// Changement de dépôt (menu de l'en-tête, ou écran de choix si aucun dépôt n'est ouvert)
const escText = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

async function fillRepoMenu(container) {
  container.innerHTML = '<p class="hint">Chargement…</p>';
  let info;

    <div class="label">Ouvrir un autre dépôt</div>
    <form class="repo-open"><input name="path" placeholder="${String.raw`C:\chemin\vers\le\projet`}" autocomplete="off" spellcheck="false"><button>Ouvrir</button></form>

  };
  container.querySelectorAll('[data-repo]').forEach(li => li.addEventListener('click', () => open(li.dataset.repo)));
  // Fenêtre native de choix de dossier, ouverte par le serveur

  browse.addEventListener('click', async () => {
